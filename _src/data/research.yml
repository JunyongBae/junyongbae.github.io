# Research 페이지. intro와 각 분야 desc에는 <b> 같은 HTML을 쓸 수 있습니다.
# 그림은 figures/thumbs/ 의 웹용 이미지를 씁니다. 한 분야에 여러 장이면 figures 목록에 위에서부터 순서대로 추가합니다.
# link를 주면 그림을 눌렀을 때 그 파일(원본 등)이 열립니다.

intro:
  en: >-
    NAIRO (<b>N</b>uclear <b>AI</b> for <b>R</b>isk &amp; <b>O</b>perations) studies how AI can be applied to
    nuclear power plant <b>operation</b> and <b>risk assessment</b> to make nuclear energy safer and more economical.
    We also study trustworthy AI that supports both areas.
  ko: "NAIRO는 보다 안전하고 경제적인 원자력발전을 위해 <b>운전</b>과 <b>리스크&nbsp;평가</b>를 두 축으로 원전 운영 전반에 AI 기술을 적용하는 방안을 연구합니다. 아울러 이를 뒷받침하는 신뢰할&nbsp;수&nbsp;있는&nbsp;AI도 함께 연구합니다."   # &nbsp; = 줄바꿈 없이 붙여 쓰기

thrusts:
  - id: "operation"
    kicker: "O · Operations"
    title: "Human–System Interaction for NPPs"
    title_ko: "원전 인간-시스템 상호작용"
    desc:
      en: >-
        Operators play a key role in nuclear power plant operation, and the human–system interface (HSI) between
        operators and the plant should support them in that role. This is especially important for advanced reactors,
        where one crew may operate multiple modules or the plant may be operated remotely. We study how AI can provide
        operators with processed, situation-appropriate information in digital main control rooms, supporting safer
        and more economical operation.
      ko: >-
        운전원은 원자력발전소 운전에서 핵심적인 역할을 담당합니다. 기계 시스템인 원자력발전소와 운전원을 잇는
        HSI(Human–System Interaction)는 운전원이 그 역할을 해낼 수 있도록 뒷받침해야 합니다. 특히 한 운전조가 여러 모듈을 맡거나
        원격 운전이 이루어질 수 있는 차세대 원자로에서는 이러한 지원 시스템의 중요성이 더욱 큽니다. 우리는 디지털화된 주제어실에서
        AI로 가공한 정보를 상황에 맞게 제공하여, 보다 안전하고 경제적인 운전을 돕고자 합니다.
    keywords: ["Emergency operation support", "Event diagnosis", "Signal validation", "Cybersecurity", "Digital twins", "Autonomous operation with deep RL"]
    figures:
      - src: "figures/thumbs/hsi-tamper-display.webp"
        alt: "Control-room display of a process-variable tampering detection system, listing suspected signals by reconstruction-error contribution with their trend plots"
      - src: "figures/thumbs/hsi-ai-control-room.webp"
        alt: "Illustration of an operator at a digital control-room console working alongside an AI assistant"

  - id: "risk"
    kicker: "R · Risk"
    title: "Safety Assessment"
    title_ko: "원자력시스템 안전성평가"
    desc:
      en: >-
        Safety assessment of a nuclear power plant examines what accidents could occur and how the plant would respond.
        This requires simulating a large number of accident scenarios and quantifying their probabilities, which involves
        heavy computation and considerable manual work. We study methods that use AI to make this process faster and simpler.
        Through this, we aim to establish a technical basis for safety‑by‑design of advanced reactors and for licensing
        based on risk information and safety performance (TI-RIPB).
      ko: >-
        원전의 안전성은 "어떤 사고가 일어날 수 있고, 그때 발전소는 어떻게 되는가"를 묻는 데서 평가됩니다. 이 질문에 답하려면
        수많은 사고 시나리오를 시뮬레이션하고 그 확률을 정량화해야 하며, 여기에는 많은 계산과 적지 않은 수작업이 뒤따릅니다.
        우리는 AI로 이 과정을 더 빠르고 간편하게 만드는 방법을 연구합니다. 이를 통해 차세대 원전을 설계 초기부터
        안전하게 다듬는 Safety‑by‑design과, 리스크 정보와 안전 성능을 중심으로 심사하는 차세대 인허가(TI-RIPB)의 기술적 기반을 마련하고자 합니다.
    keywords: ["Dynamic PSA", "Simulation optimization", "Limit surface search", "Automatic event tree generation", "Surrogate models"]
    figures:
      - src: "figures/thumbs/asoc-limitsurface.webp"
        alt: "Animation of a deep neural network with Monte Carlo dropout searching the limit surface between success and failure"
      - src: "figures/thumbs/dpsa-event-tree.webp"
        alt: "Automatically generated event tree for an SGTR scenario: 36,442 simulations split into 11 sequences, each with its share of cases and output trend"
        link: "figures/dpsa-event-tree.png"     # 누르면 원본이 크게 열림

  - id: "trust"
    kicker: "AI · Foundation"
    title: "AI for safety-critical systems"
    title_ko: "안전 필수 시스템을 위한 AI"
    desc:
      en: >-
        AI for safety-critical systems such as nuclear power plants can be used in practice only if people can understand
        and verify its decisions. We study methods that show how confident a model is in its predictions and what its
        decisions are based on, building a foundation for trustworthy AI in safety-critical systems.
      ko: >-
        원자력발전소와 같은 안전 필수 시스템(safety-critical system)을 위한 AI 기술은 사람이 그 판단을 이해하고
        검증할 수 있어야 실제 현장에 쓰일 수 있습니다. 우리는 모델이 자신의 예측을 얼마나 확신하는지, 어떤 근거로 판단했는지를
        드러내는 기술을 연구하여, 안전 필수 시스템을 위한 신뢰할 수 있는 AI의 기반을 마련하고자 합니다.
    keywords: ["Uncertainty quantification", "Explainable AI", "Case-based reasoning", "Mechanistic interpretability", "Human-in-the-loop design"]
    figures:
      - src: "figures/thumbs/xai-example-based.webp"
        alt: "Example-based explanation: a surrogate model's hidden-layer activation is used to find the most similar training scenarios, whose trends explain the prediction"
        link: "figures/xai-example-based.png"     # 누르면 원본이 크게 열림
